
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live AI Avatar Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:25px 15px;background:#101322;color:white;font-family:Arial,sans-serif;text-align:center}
h1{color:#a78bfa}
.container{max-width:900px;margin:25px auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.panel{background:#20263a;padding:20px;border-radius:15px}
.preview{height:300px;background:#080b14;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;perspective:700px}
#avatar{display:none;max-width:90%;max-height:90%;object-fit:contain;will-change:transform;transition:transform .12s linear}
video{width:100%;max-height:240px;background:black;border-radius:10px}
input{max-width:100%;margin:15px}
button{padding:12px 18px;margin:8px;background:#8b5cf6;border:0;border-radius:8px;color:white;cursor:pointer}
button:disabled{opacity:.5}
#status{color:#c4b5fd;margin:20px;overflow-wrap:anywhere}
</style>
</head>
<body>
<h1>✨ Live AI Avatar Studio</h1>
<p>Upload your portrait and control its movement with your webcam.</p>
<div class="container">
<div class="panel">
<h2>Your Avatar</h2>
<div class="preview">
<img id="avatar" alt="Uploaded portrait">
<span id="placeholder">Upload your photo here</span>
</div>
<input type="file" id="photo" accept="image/*">
</div>
<div class="panel">
<h2>Camera Tracking</h2>
<p>Camera runs privately in your browser.</p>
<button id="start">Start Tracking</button>
<button id="stop" disabled>Stop</button>
<video id="camera" autoplay playsinline muted></video>
</div>
</div>
<div class="panel" style="max-width:900px;margin:auto">
<h2>Live Movement Information</h2>
<p id="head">Head: Waiting</p>
<p id="mouth">Mouth: Waiting</p>
<p id="eyes">Eyes: Waiting</p>
<p id="status">Upload a photo to begin.</p>
</div>
<script type="module">
import {FaceLandmarker,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const camera=document.getElementById("camera");
const avatar=document.getElementById("avatar");
const status=document.getElementById("status");

let tracker=null,stream=null,running=false;
let smoothX=0,smoothY=0,smoothAngle=0;
let lastTime=-1,frameCount=0;

const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));

document.getElementById("photo").onchange=e=>{
const file=e.target.files[0];
if(!file)return;
if(!file.type.startsWith("image/")){
status.textContent="Please select an image.";
return;
}
avatar.src=URL.createObjectURL(file);
avatar.style.display="block";
document.getElementById("placeholder").style.display="none";
status.textContent="Portrait uploaded successfully!";
};

async function loadTracker(){
status.textContent="Loading face tracking engine...";
const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
tracker=await FaceLandmarker.createFromOptions(vision,{
baseOptions:{
modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
delegate:"CPU"
},
runningMode:"VIDEO",
numFaces:1,
outputFaceBlendshapes:true
});
}

async function startTracking(){
if(!avatar.src){
status.textContent="Please upload a photo first.";
return;
}
try{
document.getElementById("start").disabled=true;
if(!tracker)await loadTracker();
stream=await navigator.mediaDevices.getUserMedia({
video:{width:320,height:240,facingMode:"user"},
audio:false
});
camera.srcObject=stream;
await camera.play();
running=true;
lastTime=-1;
frameCount=0;
document.getElementById("stop").disabled=false;
status.textContent="Looking for your face...";
requestAnimationFrame(track);
}catch(error){
status.textContent="Error: "+error.message;
stopCamera();
}
}

function track(){
if(!running)return;
if(camera.readyState>=2&&camera.currentTime!==lastTime){
lastTime=camera.currentTime;
frameCount++;
if(frameCount%2===0){
requestAnimationFrame(track);
return;
}
const result=tracker.detectForVideo(camera,performance.now());
if(result.faceLandmarks.length>0){
const face=result.faceLandmarks[0];
const nose=face[1],left=face[33],right=face[263];
const distance=Math.hypot(right.x-left.x,right.y-left.y);
const middle=(left.x+right.x)/2;
const angle=Math.atan2(right.y-left.y,right.x-left.x);
const x=clamp((.5-nose.x)*100,-45,45);
const y=clamp((.5-nose.y)*75,-30,30);
const yaw=clamp(((nose.x-middle)/Math.max(distance,.001))*25,-15,15);
const roll=clamp(angle*180/Math.PI,-20,20);
smoothX+=(x-smoothX)*.2;
smoothY+=(y-smoothY)*.2;
smoothAngle+=(roll-smoothAngle)*.2;
avatar.style.transform=`translate3d(${smoothX}px,${smoothY}px,0) rotate(${smoothAngle}deg) rotateY(${yaw}deg)`;
const blend=result.faceBlendshapes[0]?.categories||[];
const score=name=>blend.find(v=>v.categoryName===name)?.score||0;
const jaw=score("jawOpen");
const blink=(score("eyeBlinkLeft")+score("eyeBlinkRight"))/2;
document.getElementById("head").textContent="Head: Tracking active";
document.getElementById("mouth").textContent="Mouth opening: "+Math.round(jaw*100)+"%";
document.getElementById("eyes").textContent="Eye blinking: "+Math.round(blink*100)+"%";
status.textContent="Face detected! Following your movements.";
}else{
document.getElementById("head").textContent="Head: No face detected";
status.textContent="Please look towards your camera.";
}
}
requestAnimationFrame(track);
}

function stopCamera(){
running=false;
if(stream){
stream.getTracks().forEach(t=>t.stop());
stream=null;
}
camera.srcObject=null;
document.getElementById("start").disabled=false;
document.getElementById("stop").disabled=true;
}

document.getElementById("start").onclick=startTracking;
document.getElementById("stop").onclick=()=>{
stopCamera();
avatar.style.transform="none";
status.textContent="Tracking stopped.";
};
</script>
</body>
</html>
